# 簡報來源：只改這個檔案，其他由引擎產生。建置：`uv run deckstyle build .`（加 `--pdf` 另以 PowerPoint 匯出向量 PDF）。
# 編輯器補全：`uv run deckstyle schema spec -o spec.schema.json`，再在檔頭加一行
# `# yaml-language-server: $schema=spec.schema.json`（VS Code 的 YAML 延伸套件）。
#
# 鍵用 kebab-case。作者（author）、日期（date）、語言（lang）與 lint 名單在 Quarto 的 `_quarto.yml`／`_metadata.yml`
# 分層設定，這裡不必寫；寫了會與上層合併（陣列串接，同 Quarto），不是取代。顏色與字型來自專案的 `_brand.yml`。
# 每頁是一個 mapping：內容頁有 ref、title、blocks、notes；章節分隔頁與結語頁用 `type: divider`、`type: closing`。
# 每個區塊是 `{block: 名稱, ...欄位}`，欄位見 tools/deckstyle/README.md；顏色只用 kind 名稱，不寫色碼。
# 投影片不寫倉庫名稱與代碼名稱（服務代號、路徑、設定鍵、檔名）；畫面用實際截圖，路徑相對本檔所在目錄。
# 範例內容為虛構的「現場雙碼掃描系統」，數字皆為示例。
title: |-
  把人為紀律
  變成可驗證的結構
subtitle: 雙碼掃描讓工時、防錯與追溯都落在系統裡
category: 技術提案 · 範例
short-title: 現場雙碼掃描 · 技術提案
output-file: D01_現場雙碼掃描技術提案_v1.0
lint:
  deny: []
  allow: []
notes: 封面不放日期與機密字樣；講稿：一句話講完這份簡報要解決什麼。
slides:
- ref: 00 摘要 · Summary
  title: 三個結論：工時準、錯誤擋在進站、歷程可追溯
  blocks:
  - block: steps
    items:
    - num: 秒級
      title: 工時自動計算
      body: [雙碼掃描即起訖, 不再事後補登]
    - num: 進站
      title: 錯誤當場攔截
      body: [撞單與跳站, 掃描當下判定]
    - num: 全程
      title: 歷程事件流水
      body: [只增不改, 異常可溯源]
  - {block: banner, kind: green, h: 1.0, title: 核心主張：把規則寫進系統，現場只管掃碼, body: 規則集中在雲端判定，終端不留判斷邏輯。}
  notes: 講稿：先講一個真實事故，再帶出三個結論；頁面只留骨架與數據。
- ref: 01 現況 · Problem
  title: 現場三大結構性問題：工時失真、防錯真空、追溯斷鏈
  blocks:
  - {block: banner, kind: red, h: 0.8, title: 核心問題：資料靠事後補登，無法即時防錯與追溯}
  - block: cards
    h: 2.6
    items:
    - kind: red
      title: 工時失真
      body: ['**起訖失真**：下班憑記憶補登', '**工時不純**：換模混入切削', '**標準失準**：缺數據無從排程']
    - kind: red
      title: 防錯真空
      body: ['**撞單衝突**：前單未完即排單', '**跳站漏刷**：跨機台工序重疊', '**防呆失效**：隔天才發現錯']
    - kind: red
      title: 追溯斷鏈
      body: ['**抹除軌跡**：塗改覆蓋歷程', '**時序中斷**：缺時間戳記', '**責任難明**：異常無法溯源']
  - block: note
    lines: [對策：掃機台與工單雙碼，由雲端重播判定進出站並秒算工時]
  notes: 講稿：每張卡片一個現場案例；鋪陳放這裡，投影片不放長句。
- {type: divider, ref: 第二部分, title: 系統怎麼運作, sub: 架構、流程與跨角色時序, notes: 章節分隔頁：只放章名與一句說明，讓聽眾換氣。}
- ref: 02 架構 · Architecture
  title: 三層架構：現場掃碼、雲端判定、資料留存
  blocks:
  - block: arch-graph
    cols: 3
    rows: 2
    col-headers: [現場, 雲端服務, 資料留存]
    nodes:
    - {id: tm, col: 0, row: 0, kind: dark, title: 掃碼終端, en: Scan Terminal, sub: 機台碼＋工單碼}
    - {id: ev, col: 1, row: 0, kind: green, title: 事件接收, en: Event Intake, sub: 驗簽並寫入流水}
    - {id: st, col: 2, row: 0, kind: blue, title: 事件流水, en: Event Log, sub: 只增不改}
    - {id: op, col: 0, row: 1, kind: amber, title: 人工補掃, en: Manual Rescan, sub: 網路中斷時暫存}
    - {id: rl, col: 1, row: 1, kind: green, title: 規則判定, en: Rule Check, sub: 撞單、跳站即時攔截}
    - {id: rp, col: 2, row: 1, kind: red, title: 異常待審, en: Exception Review, sub: 須主管判斷}
    edges:
    - {from: tm, to: ev, kind: forward, label: 掃碼}
    - {from: ev, to: st, kind: green, label: 寫入}
    - {from: op, to: rl, kind: dashed, label: 補送}
    - {from: rl, to: rp, kind: blocked, label: 攔截}
  - block: note
    lines: [規則只在雲端一份；終端離線時暫存，恢復後補送]
  notes: 講稿：先講資料流向，再講哪些節點是系統確定、哪些要人判斷。
- ref: 03 流程 · Flow
  title: 一次掃描的四個步驟，每步都有明確的判定結果
  blocks:
  - block: flow
    caption: 進站流程
    numbered: true
    h: 1.8
    items:
    - {kind: dark, title: 掃機台碼, body: 確認機台與班別}
    - {kind: dark, title: 掃工單碼, body: 取得工序與前站}
    - {kind: green, title: 雲端判定, body: 撞單、跳站即攔截}
    - {kind: solid_dark, title: 開始計時, body: 寫入起始事件}
  - block: note
    lines: [判定在雲端：同樣輸入恆得同樣結果，可重播、可稽核]
  notes: 講稿：現場示範一次掃描；失敗時的畫面放備份投影片。
- ref: 04 角色 · Swimlane
  title: 跨角色時序：誰在何時做什麼，攔截發生在哪一步
  blocks:
  - block: swimlane
    lanes:
    - {name: 作業員, sub: 現場}
    - {name: 掃碼終端, sub: 邊緣}
    - {name: 雲端判定, sub: 規則}
    - {name: 主管, sub: 審核}
    steps:
    - {lane: 0, kind: dark, title: 掃兩碼, sub: 機台與工單}
    - {lane: 1, kind: dark, title: 送出事件, sub: 帶時間戳記}
    - {lane: 2, kind: green, title: 規則判定, sub: 重播流水}
    - {lane: 2, kind: red, title: 發現撞單, sub: 擋下並告警, edge: blocked}
    - {lane: 3, kind: amber, title: 人工裁決, sub: 放行或退回}
    thesis:
    - {kind: green, title: 確定的由系統判, body: 同樣輸入恆得同樣結果}
    - {kind: red, title: 例外交給人, body: 系統只攔截，不代替裁決}
  notes: 講稿：沿著編號走一遍；紅色步驟是系統攔下、交給人的地方。
- ref: 05 比較 · Comparison
  title: 三種方案在時效、防錯與追溯上的取捨
  blocks:
  - block: table
    col-w: [2, 3, 3, 3]
    rows:
    - [面向, 紙本補登, 桌面報表, 雙碼即時掃描]
    - - 時效
      - 隔天
      - 當日
      - [即時, green]
    - - 防錯
      - [無, red]
      - 事後檢核
      - [進站攔截, green]
    - - 追溯
      - 塗改覆寫
      - 單點快照
      - [事件流水, green]
    - - 導入成本
      - [最低, green]
      - 中
      - 中高
  - block: note
    lines: [取捨：防錯與追溯是核心價值，導入成本以分階段攤平]
  notes: 講稿：逐列比較，強調綠色儲存格是選擇雙碼方案的理由。
- ref: 06 畫面 · Screens
  title: 實際畫面：工單清單與異常告警
  blocks:
  - block: shots
    items:
    - {image: screens/sample.png, title: 工單清單, body: 換成實際程式的截圖。}
    side-w: 4.2
    side:
    - {kind: blue, title: 怎麼看, body: 每列一張工單，狀態一目了然。}
    - {kind: amber, title: 怎麼處理, body: 異常列由主管在同一頁裁決。}
  notes: 講稿：畫面一律用實際截圖（示範資料），不用手繪示意；圖說用白話描述畫面，不寫路徑與代號。
- ref: 07 分層 · Layers
  title: 我們提供什麼、不碰什麼：三層責任分界
  blocks:
  - block: layers
    tiers:
    - name: 應用
      sub: 我們提供
      kind: solid_dark
      title: 掃碼與判定服務
      body: [終端、規則、報表]
    - name: 平台
      sub: 我們自建
      kind: blue
      title: 容器平台與資料庫
      body: [自動部署、備份]
    - name: 基礎設施
      sub: 向供應商取得
      kind: gray
      title: 虛擬主機
      body: [機房與虛擬化由供應商管]
  notes: 講稿：責任分界決定誰負責什麼；客戶只碰最上層。
- ref: 08 實測 · Evidence
  title: 試點實測：工時回報延遲與漏刷率都明顯下降
  blocks:
  - block: bench-chart
    groups:
    - title: 實測一：工時回報延遲（分鐘，越低越好，示例數據）
      bars:
      - {label: 改善前, ratio: 1.0, value: 約 480, kind: red}
      - {label: 改善後, ratio: 0.04, value: < 1（降幅 99%）, kind: green}
    - title: 實測二：漏刷率（%，越低越好，示例數據）
      bars:
      - {label: 改善前, ratio: 0.6, value: 6.0%, kind: red}
      - {label: 改善後, ratio: 0.08, value: 0.8%, kind: green}
    thesis:
    - kind: green
      title: 已驗證
      body: [單條產線兩週試點, 兩項指標皆達標]
    - kind: amber
      title: 未驗證
      body: [全廠長期穩定度, 離線補送的實際比例]
  notes: 講稿：數字一律標示是示例或實測，並寫明未驗證的部分，不把形成性結果說成總結性結論。
- ref: 09 時程 · Timeline
  title: 分三波上線：先攔截，再留存，最後擴及全廠
  blocks:
  - block: timeline-diagram
    tracks:
    - title: 軌道一：系統上線
      phases:
      - {time: 第 1 月, kind: gray, title: 盤點與定義, body: 工序與資料欄位}
      - {time: 第 2 月, kind: green, title: 試點上線, body: 單條產線驗證}
      - {time: 第 4 月, kind: solid_dark, title: 全廠推廣, body: 所有機台與稽核}
    - title: 軌道二：現場配合
      phases:
      - {time: 第 1 月, kind: gray, title: 掃碼訓練, body: 作業員與班長}
      - {time: 第 3 月, kind: green, title: 規則校準, body: 依誤攔案例調整}
      - {time: 第 5 月, kind: solid_dark, title: 流程定版, body: 寫入作業標準}
  notes: 講稿：每階段的負責人與時程放在備註，投影片只放可驗收的結果。
- ref: 09 成果 · Results
  title: 試點成果一眼看：三個指標都達標
  blocks:
  - block: kpi
    items:
    - {value: < 1 分, label: 工時回報延遲, sub: 改善前約 480 分鐘, kind: green}
    - {value: 0.8%, label: 漏刷率, sub: 改善前 6.0%, kind: green}
    - {value: 100%, label: 撞單攔截率, sub: 試點期間共 37 次, kind: blue}
  - block: note
    lines: [以上為單條產線兩週試點的示例數據，全廠長期穩定度尚未驗證]
  notes: 講稿：大數字只放結論；數據來源與期間寫在備註，未驗證的部分要講清楚。
- ref: 10 趨勢 · Trend
  title: 漏刷率逐週下降，第三週起穩定在 1% 以下
  blocks:
  - block: chart
    type: column
    title: 每週漏刷率（%，示例數據）
    categories: [第 1 週, 第 2 週, 第 3 週, 第 4 週]
    series:
    - name: 漏刷率
      values: [6.0, 2.4, 0.9, 0.8]
      kind: blue
    fmt: '0.0'
    side:
    - {kind: green, title: 怎麼看, body: 每根長條是一週的平均值。}
    - {kind: amber, title: 要留意, body: 第 1 週含學習期，不代表常態。}
  notes: 講稿：原生圖表可在 PowerPoint 裡直接編輯資料；折線（line）、橫條（bar）、圓餅（pie）用法相同。
- ref: 11 結論 · Conclusion
  title: 結論與下一步：驗收指標與主要風險
  blocks:
  - block: columns
    cols:
    - title: 驗收指標
      kind: green
      items: [漏刷率降至 1% 以下, 工時回報延遲 < 1 分鐘]
    - title: 主要風險
      kind: red
      items: [現場掃碼習慣改變, 網路中斷時的離線補送]
  - block: note
    lines: [下一步：核准試點預算，兩週內開始單線驗證]
  notes: 講稿：結論頁停留給提問；風險要附對策。
- ref: 12 參考文獻 · References
  title: 參考文獻
  blocks:
  - block: references
    title: APA 第 7 版，依第一作者字母排序
    items:
    - "International Society of Automation. (2010). Enterprise-control system integration — Part 1: Models and terminology (ANSI/ISA-95.00.01-2010). ISA."
    - "International Society of Automation. (2013). Enterprise-control system integration — Part 3: Activity models of manufacturing operations management (ANSI/ISA-95.00.03-2013). ISA."
  notes: 講稿：書目照原文寫成一整行，折行與懸掛縮排交給引擎。
- {type: closing, title: 謝謝，歡迎提問, sub: 下一步：核准試點預算，兩週內開始單線驗證, meta: 歡迎來信討論, notes: 結語頁停留給提問。}
